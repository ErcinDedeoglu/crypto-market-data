name: Run dublok/github.action.cryptomarketdata

on:
  schedule:
    # Fallback schedule - runs every 6 hours as safety net
    # Only starts if no workflow is currently running
    - cron: '0 */6 * * *'
  
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'What triggered this run'
        required: false
        default: 'manual'
      previous_run:
        description: 'Previous run ID (for auto-continuation)'
        required: false

# Concurrency ensures only ONE job runs at a time
# cancel-in-progress: false means new runs WAIT (queue) instead of canceling current
# This protects against cron + dispatch collision
concurrency:
  group: cryptomarketdata-collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Log trigger information
        run: |
          echo "Triggered by: ${{ github.event.inputs.triggered_by || 'schedule' }}"
          echo "Previous run: ${{ github.event.inputs.previous_run || 'N/A' }}"
          echo "Current run: ${{ github.run_id }}"
          echo "Workflow file: ${{ github.workflow }}"

      - name: Debug Token
        run: |
          TOKEN="${{ secrets.GH_TOKEN }}"
          echo "Token length: ${#TOKEN}"
          echo "Token starts with: ${TOKEN:0:4}"
          # Test the token directly
          curl -s -H "Authorization: token $TOKEN" https://api.github.com/user | jq '.login // "FAILED"'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull and Run Docker Container
        env:
          MAX_RUNTIME: "5h55m"
          OVERLAP_TRIGGER_BEFORE: "5m"
          WORKFLOW_FILENAME: "build-and-run.yml"
        run: |
          docker pull dublok/github.action.cryptomarketdata:beta
          docker run --rm \
            --network host \
            -e GITHUB_TOKEN="${{ secrets.GH_TOKEN }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_REF_NAME="${{ github.ref_name }}" \
            -e GITHUB_RUN_ID="${{ github.run_id }}" \
            -e GITHUB_ACTIONS="true" \
            -e WORKFLOW_FILENAME="${WORKFLOW_FILENAME}" \
            -e MAX_RUNTIME="${MAX_RUNTIME}" \
            -e OVERLAP_TRIGGER_BEFORE="${OVERLAP_TRIGGER_BEFORE}" \
            -e HTTP_PROXY="${{ secrets.HADES_PROXY }}" \
            -e HTTPS_PROXY="${{ secrets.HADES_PROXY }}" \
            -e ALL_PROXY="${{ secrets.HADES_PROXY }}" \
            dublok/github.action.cryptomarketdata:beta