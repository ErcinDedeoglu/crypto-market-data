name: Run dublok/github.action.cryptomarketdata

on:
  # schedule:
  #   - cron: '5 0 * * *'   # Runs daily at 00:05 UTC
  #   - cron: '30 0 * * *'  # Runs daily at 00:30 UTC
  #   - cron: '0 1 * * *'   # Runs daily at 01:00 UTC
  #   - cron: '0 2 * * *'   # Runs daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual run'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull and Run Docker Container
        run: |
          docker pull dublok/github.action.cryptomarketdata:beta
          docker run --rm \
            --network host \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_REPO_URL="https://github.com/${{ github.repository }}" \
            -e GITHUB_BRANCH="${{ github.ref_name }}" \
            -e HTTP_PROXY="${{ secrets.HADES_PROXY }}" \
            -e HTTPS_PROXY="${{ secrets.HADES_PROXY }}" \
            -e ALL_PROXY="${{ secrets.HADES_PROXY }}" \
            dublok/github.action.cryptomarketdata:beta

      - name: Cleanup
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true